name: Publish Windows installer

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows installer workflow run ID
        required: true
        type: string
      tag:
        description: Release tag
        required: true
        default: v0.4.0
        type: string
      target_sha:
        description: Commit represented by the installer
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download verified Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name ElTemploHuella-Windows-x64 --dir release

      - name: Verify checksum
        working-directory: release
        run: sha256sum --check ElTemploHuella-Setup.exe.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          gh release create "$TAG" \
            release/ElTemploHuella-Setup.exe \
            release/ElTemploHuella-Setup.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "El Templo Huella para Windows $TAG" \
            --notes "Conector biométrico visual para usar el CRM web desde Windows 10/11 x64. Instala únicamente el servicio del lector, el certificado local y la vinculación automática con la sede; no instala una copia del CRM ni WebView2. Requiere una cuenta con permiso para administrar dispositivos. El lector físico HID U.are.U 4500 debe completar la lista de aceptación incluida en el repositorio. Este binario todavía no tiene firma Authenticode comercial, por lo que Windows puede mostrar SmartScreen."
