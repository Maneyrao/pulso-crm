name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valores obviamente falsos. Ningún secreto real vive en este archivo.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pulso_ci?schema=public
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pulso_ci?schema=public
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: ci-only-not-a-real-secret-0000000000000000
  # Sin MASTER_KEK la biometría no puede cifrar plantillas y todo test que cree
  # una credencial responde 500. Se normaliza con SHA-256, así que cualquier
  # string sirve: éste es obviamente falso y sólo vale dentro de CI.
  MASTER_KEK: ci-only-not-a-real-master-kek-000000000000
  COOKIE_DOMAIN: localhost
  CORS_ORIGINS: http://localhost:4000
  NODE_ENV: test

jobs:
  lint:
    name: Lint y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pulso/db exec prisma generate
      - run: pnpm build --filter='./packages/*'
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  secrets:
    name: Detección de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pulso_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pulso/db exec prisma generate
      - run: pnpm build --filter='./packages/*'
      - run: pnpm --filter @pulso/db exec prisma migrate deploy
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pulso/db exec prisma generate
      - run: pnpm build
