# Opcional (ADR-020). El camino soportado en macOS sin Docker es
# `pnpm dev:services`, que usa los servicios nativos de Homebrew.
# Este compose existe para quien sí tenga Docker y para CI.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pulso_dev
    ports:
      - '5432:5432'
    volumes:
      - pulso_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pulso_pgdata:
